<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vender contact</title>
<style>
:root{--bg:#eef3f7;--card:#fff;--ink:#0d2b45;--sub:#5d7488;--line:#d9e3ea;--badge:#0d2b45;--badge-ink:#fff;--green:#06c755;--green-h:#05a947;--shadow:0 6px 24px rgba(13,43,69,.08);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1722;--card:#13232f;--ink:#eaf2f7;--sub:#8fa6b6;--line:#243746;--badge:#2b5d85;--shadow:0 6px 24px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0b1722;--card:#13232f;--ink:#eaf2f7;--sub:#8fa6b6;--line:#243746;--badge:#2b5d85;--shadow:0 6px 24px rgba(0,0,0,.4)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Prompt","Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:40px 18px 56px}
header{text-align:center;margin-bottom:28px}
.mark{display:inline-block;width:44px;height:6px;border-radius:3px;background:linear-gradient(90deg,#e4002b,#0d2b45);margin-bottom:16px}
h1{margin:0;font-size:1.9rem;font-weight:600;letter-spacing:.01em}
header p{margin:8px 0 0;color:var(--sub);font-size:.95rem}
ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
li{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 16px 18px 20px;box-shadow:var(--shadow);border-left:5px solid var(--green)}
.name{flex:1;min-width:0;font-weight:600;font-size:1.15rem;overflow-wrap:anywhere}.name small{display:block;margin-top:2px;font-weight:400;font-size:.8rem;color:var(--sub)}
.btn{flex:none;display:inline-flex;align-items:center;gap:8px;background:var(--green);color:#fff;text-decoration:none;font-weight:600;font-size:.95rem;padding:10px 18px;border-radius:999px;transition:background .15s,transform .15s}
.actions{flex:none;display:flex;gap:8px}.btn.tel{background:transparent;color:var(--ink);border:1.5px solid var(--line)}.btn.tel svg{fill:var(--ink)}.btn.tel:hover{background:var(--bg);border-color:var(--sub)}
.btn:hover{background:var(--green-h)}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.btn svg{width:20px;height:20px;fill:#fff}
footer{text-align:center;color:var(--sub);font-size:.8rem;margin-top:28px}
@media (max-width:480px){li{flex-wrap:wrap}.actions{width:100%}.btn{flex:1;justify-content:center}}
</style>
</head>
<body>
<main>
  <header>
    <span class="mark"></span>
    <h1>Vender contact</h1>
    <p>คลิกเพื่อติดต่อ Vender แต่ละราย</p>
  </header>
  <ul id="list"></ul>
  <footer>Veolia Water Technologies &amp; Solutions</footer>
</main>
<script>
// เพิ่ม Vender ใหม่: [ชื่อ, ลิงก์กลุ่ม LINE, เบอร์โทร, ข้อความใต้ชื่อ]  (เว้น "" = ไม่แสดงปุ่มนั้น)
var vendors = [
  ["Interpretive", "https://line.me/ti/g/7UphMzkQ35", ""],
  ["JL Chemtonic", "https://line.me/ti/g/nqDdutcNKn", ""],
  ["ALS testing services", "", "0827805685", "คุณพอกมล"]
];
var lineIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C6.5 2 2 5.6 2 10c0 3.9 3.5 7.2 8.2 7.9.3.1.8.2.9.5.1.3.1.7 0 1l-.1.9c0 .3-.2 1 .9.6 1.1-.5 5.8-3.4 7.9-5.8C21.200 13.600 22 11.900 22 10c0-4.400-4.500-8-10-8z"/></svg>';
var telIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.800a15.100 15.100 0 0 0 6.600 6.600l2.200-2.200a1 1 0 0 1 1-.25 11.400 11.400 0 0 0 3.600.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.500a1 1 0 0 1 1 1c0 1.250.2 2.450.57 3.600a1 1 0 0 1-.25 1z"/></svg>';
var ul = document.getElementById("list");
vendors.forEach(function(v){
  var li = document.createElement("li");
  var tel = v[2] ? '<a class="btn tel" aria-label="โทรหา '+v[0]+'">'+telIcon+'โทร</a>' : '';
  var line = v[1] ? '<a class="btn line" target="_blank" rel="noopener" aria-label="เข้ากลุ่ม LINE ของ '+v[0]+'">'+lineIcon+'LINE</a>' : '';
  li.innerHTML = '<div class="name"><span></span><small></small></div><div class="actions">'+tel+line+'</div>';
  li.querySelector("small").textContent = v[3] || (v[1] ? "LINE group" : "");
  li.querySelector(".name span").textContent = v[0];
  if (v[1]) li.querySelector(".line").href = v[1];
  if (v[2]) li.querySelector(".tel").href = "tel:" + v[2].replace(/[^0-9+]/g,"");
  ul.appendChild(li);
});
</script>
</body>
</html>
